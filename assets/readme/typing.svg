<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 200 40'
    style='background-color: #00000000;'
    width='200px' height='40px'>

    
                    <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d0.end'
                    dur='2500ms' fill='remove'
                    values='m0,20 h0 ; m0,20 h200 ; m0,20 h200 ; m0,20 h0' keyTimes='0;0.8;0.8;1' />
                    </path>
    <text font-family='"monospace", monospace' fill='#8C43EA' font-size='25'
        dominant-baseline='middle'
        x='0%' text-anchor='start'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            🌱ANGJustinl🌱 !
        </textPath>
    </text>
</svg>
