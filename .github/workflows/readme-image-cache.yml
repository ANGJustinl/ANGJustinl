name: README image cache

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 */3 * *'

jobs:
  cache-readme-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: readme-image-cache-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh images and retain the last successful downloads
        run: python .github/scripts/cache_readme_images.py
      - name: Commit updated images
        env:
          CACHE_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md assets/readme/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update README image cache [skip ci]'
          # Waka Readme and Metrics also write to this branch. Incorporate their
          # commits before pushing; never overwrite a concurrent update.
          for attempt in 1 2 3; do
            git fetch origin "$CACHE_BRANCH"
            git rebase FETCH_HEAD
            if git push origin "HEAD:$CACHE_BRANCH"; then
              exit 0
            fi
          done
          exit 1
